<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./fontawesome-free-6.7.2-web/fontawesome-free-6.7.2-web/css/all.min.css">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: rgb(253, 253, 253);
        }
        .Instagram{
            height: 300px;
            width: 300px;
            border: 1px solid;
            border: none;
            border-radius:20%;
            
            background: radial-gradient(
                circle at 70% 110%,
                #ffd600 0%,
                #ffb000 20%,
                #ff6a00 35%,
                #ff0069 55%,
                #ff00c8 75%,
                #b000ff 90%,
                #5a00ff 100%
            );
            
           

        }

        .inner {
            height: 180px;
            width: 180px;
            border: 12px solid white;
            border-radius: 50px;
            position: absolute;
            transform: translate(-50%,-50%);
            top: 50%;
            left: 50%;


        }

        .circle {


            height: 70px;
            width: 70px;
            border: 12px solid white;
            border-radius: 70px;
            position: absolute;
            transform: translate(-50%,-50%);
            top: 50%;
            left: 50%;

        }

        .dot {
            height: 18px;
            width: 18px;
            border: 5px solid white;
            border-radius: 18px;
            background-color: rgb(252, 252, 252);
            position: absolute;
            top:20%;
            right: 10%;

        }
    </style>
</head>

<body>


    <div class="Instagram">
        <div class="inner">
            <div class="circle"></div>
            <div class="dot"></div>
        </div>
    </div>
</body>

</html>
